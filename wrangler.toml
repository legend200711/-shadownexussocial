name = "yellow-term-11e6"
main = "upload-worker.js"
compatibility_date = "2024-01-01"
account_id = "f276c4406b82d3c1e35efed1ef486235"

# ── Cloudflare R2 Bucket ──────────────────────────────────────────────────────
# All Shadow Nexus Social media files are stored here:
#   profile pictures, post images, videos, music, message attachments
# Firebase stores only the public URL + metadata — never the raw file.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "legend"

# ── Non-secret environment variables ──────────────────────────────────────────
# LiveKit credentials (stored as encrypted Worker secrets, not in this file)
# Provisioned via: wrangler secret put LIVEKIT_API_KEY / LIVEKIT_API_SECRET
[vars]
LIVEKIT_URL   = "wss://chris-oxi8fwap.livekit.cloud"
SNX_ORIGIN    = "https://shadownexussocial.online"
SNX_ORIGIN2   = "https://chrislegendofshadows.com"
BUCKET_NAME   = "legend"

# ── REQUIRED WORKER SECRETS ─────────────────────────────────────────────────
# Set these via wrangler CLI — NEVER put real values in this file.
#
#   npx wrangler secret put FIREBASE_WEB_API_KEY
#     → Firebase Web API Key (from Firebase Console → Project Settings → General)
#     → Used to verify Firebase ID tokens server-side on every upload/delete.
#     → Without this, ALL uploads return HTTP 503 "Auth service not configured".
#
#   npx wrangler secret put LIVEKIT_API_KEY
#   npx wrangler secret put LIVEKIT_API_SECRET
#     → LiveKit API credentials for room creation and token generation.
#
#   npx wrangler secret put CLOUDFLARE_ACCOUNT_ID    (optional — for Stream)
#   npx wrangler secret put CLOUDFLARE_API_TOKEN     (optional — for Stream)
#     → Required only for Cloudflare Stream video uploads.
#
#   npx wrangler secret put R2_ACCESS_KEY_ID         (optional — for presigned URLs)
#   npx wrangler secret put R2_SECRET_ACCESS_KEY     (optional — for presigned URLs)
#     → R2 S3-compatible API credentials for presigned multipart part URLs.
#     → If not set, /mpu/part proxy path is used instead (slightly slower but works).
#
#   npx wrangler secret put ADMIN_UIDS
#     → Comma-separated Firebase UIDs with admin/founder delete permissions.

# ── Cloudflare Security Notes ─────────────────────────────────────────────────
# Enable these in the Cloudflare Dashboard for full protection:
#
#   1. Firewall Rules (WAF)
#      - Rate limit: 100 requests/minute per IP on POST /
#      - Block requests with suspicious User-Agents (bots, scrapers)
#      - Block requests from known malicious IPs (automatic with Pro plan)
#
#   2. DDoS Protection
#      - Enabled automatically on all Cloudflare plans
#      - Set sensitivity to "High" for the /upload-worker route
#
#   3. Bot Management
#      - Enable "Bot Fight Mode" (free) or Bot Management (Pro+)
#      - Blocks automated upload attempts and credential stuffing
#
#   4. CDN + Caching
#      - Media files are served with Cache-Control: immutable (1 year)
#      - Cloudflare edge caches all GET requests automatically
#      - Use Cache Rules to set Edge TTL = 1 month for /{uid}/* paths
#
#   5. Access Control
#      - Origin check: worker validates Origin header against ALLOWED_ORIGINS
#      - UID-scoped storage: each file path is prefixed with {userUid}/
#      - File type allowlist enforced server-side (images/video/audio only)
