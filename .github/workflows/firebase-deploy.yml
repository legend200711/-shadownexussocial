name: Firebase Hosting (Disabled — GitHub Pages is production frontend)

# Firebase Hosting deployment is intentionally disabled.
# shadownexussocial.online is served by GitHub Pages (master branch root).
# Firebase continues to serve Auth, Firestore, Realtime Database, and Storage.
# To re-enable: add FIREBASE_TOKEN to repository secrets and restore the deploy step.

on:
  push:
    branches:
      - master
      - main

jobs:
  skipped:
    name: Firebase Hosting — SKIPPED (GitHub Pages is production)
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped status
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  FIREBASE HOSTING DEPLOY — SKIPPED                  ║"
          echo "║                                                      ║"
          echo "║  Production frontend: GitHub Pages (master branch)  ║"
          echo "║  Custom domain:       shadownexussocial.online       ║"
          echo "║                                                      ║"
          echo "║  Firebase services still active:                     ║"
          echo "║    • Firebase Auth                                   ║"
          echo "║    • Firestore                                       ║"
          echo "║    • Realtime Database                               ║"
          echo "║    • Storage                                         ║"
          echo "║                                                      ║"
          echo "║  This job is a placeholder. It does NOT deploy       ║"
          echo "║  to Firebase Hosting (horr-a08f4.web.app).          ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "RESULT: SKIPPED — Firebase Hosting deployment is disabled."
          echo "GitHub Pages is the authoritative production frontend host."
